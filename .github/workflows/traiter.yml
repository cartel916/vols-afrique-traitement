name: Traitement des journées ADS-B (Brésil)

on:
  workflow_dispatch:
    inputs:
      plan:
        description: "Fichier de plan du dépôt (lots de journées à traiter)"
        required: true
        default: "plans/bresil-2025.json"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        env:
          PLAN: ${{ inputs.plan }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          p = json.load(open(os.environ["PLAN"]))
          lots = [{"lot": str(l["id"]), "dates": " ".join(d for d in l["dates"] if re.fullmatch(r"\d{4}-\d{2}-\d{2}", d))}
                  for l in p["lots"]]
          print("matrix=" + json.dumps({"include": lots}))
          PY

  traiter:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dépendances
        run: |
          pip install -q -r requirements.txt
          nproc && free -g | head -2
      - name: Traitement du lot ${{ matrix.lot }}
        env:
          VOLS_SORTIE: ${{ github.workspace }}/out
          LOT: ${{ matrix.lot }}
          DATES: ${{ matrix.dates }}
        run: python lot.py "$LOT" $DATES
      - name: Retrait des traces brutes trop volumineuses
        if: always()
        run: rm -f out/*/brut.tar
      - name: Résultats du lot (out/)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bresil-${{ matrix.lot }}
          path: out/
          retention-days: 7
          if-no-files-found: warn
